<header class="topbar">

  <div class="topbar-actions">
    <button id="btn-profile" class="btn-icon" title="Профиль">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
    </button>
    <button id="btn-heart" class="btn-icon" title="Настройки">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>

      </svg>
    </button>
    <button id="btn-lock" class="btn-icon" title="Заблокировать">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </button>
  </div>
</header>
<main id="content"></main>

      <svg width="220" height="220" viewBox="0 0 220 220">

</div>

<div id="bottom-panel" style="display: none;">
  <div id="panel-controls" style="justify-content: space-between;">
    <div style="display:flex; gap:8px;">
      <button id="btn-filter" class="capsule">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
        </svg>
      </button>
      <button id="btn-calendar" class="capsule">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2"></rect>
          <path d="M16 2v4M8 2v4M3 10h18"></path>
        </svg>
      </button>
    </div>
    
    <button id="btn-modes" class="capsule" style="width: auto; padding: 0 16px; font-size: 13px; font-weight: 500; border-radius: 12px; display: flex; align-items: center; gap: 6px;">
      <span id="btn-modes-label">Сырые сессии</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </button>
  </div>
</div>

<script>
window.onerror = function(msg, url, line, col, error) {
  var el = document.createElement('div');
  el.style.cssText = 'position:fixed;top:0;left:0;right:0;background:red;color:#fff;padding:15px;z-index:99999;font-size:14px;font-family:monospace;white-space:pre-wrap;';
  el.textContent = 'JS ERROR: ' + msg + '\n' + (url||'') + ':' + line + ':' + col;
  document.body.appendChild(el);
  return false;
};
</script>
