<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Хераборина</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/base.css?v=999">
<link rel="stylesheet" href="css/components.css?v=999"
</head>
<body>
<div id="app"></div>






<!-- Дашборд (скрыт по умолчанию) -->
<div id="dashboard" class="screen active">
<header class="topbar">
  <div class="logo" id="logo-btn" style="cursor: pointer;">
    <img src="icon.svg" alt="" class="logo-icon" style="width:32px;height:32px;vertical-align:middle;margin-right:8px;border-radius:50%;">
    Хераборина
  </div>
  <div class="topbar-actions">
    <button id="btn-heart" class="btn-icon" title="Инфо">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
    </button>
    <button id="btn-lock" class="btn-icon" title="Заблокировать">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </button>
  </div>
</header>

<main id="content"></main>
<main id="content-diary" class="hidden"></main>
<main id="content-projects" class="hidden"></main>
<main id="content-activity" class="hidden"></main>
</div>

<div id="loading" class="screen hidden">
<div class="spinner"></div>
<p>Расшифровка…</p>
</div>

<nav class="tabs" style="display: flex;">
  <button id="tab-dashboard" class="tab tab-active" data-tab="dashboard"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px;"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>Дашборд</button>
  <button id="tab-diary" class="tab" data-tab="diary"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px;"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Календарь</button>
  <button id="tab-projects" class="tab" data-tab="projects"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px;"><path d="M3 7h18v13H3z"/><path d="M3 7l2-4h14l2 4"/><path d="M12 11v6"/></svg>Проекты</button>
  <button id="tab-activity" class="tab"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px;"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>График</button>
  <button id="tab-profile" class="tab"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Профиль</button>
</nav>


<!-- === СЛЕПОЙ СЕЙФ (v45) === -->
<div id="scroll-pin-screen">
  <!-- Жестко задаем абсолютное позиционирование контейнера в правом нижнем углу -->
  <div id="safe-dial-container" style="position: fixed; right: 20px; bottom: 250px; width: 220px; height: 220px; touch-action: none; z-index: 9999; margin: 0; padding: 0;">
    
    <div id="safe-dial-rotator" class="waiting" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;">
      <svg width="220" height="220" viewBox="0 0 220 220">
        <circle cx="110" cy="110" r="90" fill="none" stroke="#FFA500" stroke-width="30"/>
        <circle cx="110" cy="20" r="8" fill="#fff"/>
      </svg>
    </div>

    <div id="safe-dial-lens" style="position: absolute; width: 50px; height: 50px; background: radial-gradient(circle, rgba(255,165,0,0.9) 0%, rgba(255,165,0,0) 70%); border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%) scale(0); opacity: 0; z-index: 100; box-shadow: 0 0 15px rgba(255,165,0,0.8); transition: transform 0.1s, opacity 0.1s;"></div>

    <div id="safe-timer" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20; font-size: 16px; font-weight: 600; color: var(--fg-dim); text-align: center; width: 100px; pointer-events: none; user-select: none;">Коснись, чтобы начать</div>
  </div>
</div>
<!-- === КОНЕЦ СЕЙФА === -->

<script src="crypto.js?v=999"></script>
<script src="js/ui.js?v=999"></script>
<script src="js/chart.js?v=999"></script>
<script src="js/auth.js?v=7"></script>
<script src="app.js?v=505"></script>
<script src="js/safe.js?v=103"
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js?v=999', { updateViaCache: 'none' }).catch(function(){});
}
</script>
</body>
</html>
