<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Хераборина</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/base.css?v=189">
<link rel="stylesheet" href="css/components.css?v=190">
</head>
<body>
<div id="app"></div>

<div id="pin-screen" class="screen">
<div class="pin-box">
<img src="icon.svg" alt="" class="pin-logo">
<h1>Хераборина</h1>
<p class="pin-sub">Введи PIN</p>
<div id="pin-display" class="pin-display"></div>
<div class="pin-pad">
<button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button>
<button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button>
<button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button>
<button data-d="clear" class="pin-fn">C</button><button data-d="0">0</button><button data-d="del" class="pin-fn">⌫</button>
</div>
<div id="pin-error" class="pin-error"></div>
<p class="pin-hint">PIN не хранится на сервере.<br>Данные расшифровываются локально.</p>
</div>
</div>

<div id="dashboard" class="screen hidden">
<header class="topbar">
  <div class="logo" id="logo-btn" style="cursor: pointer;">
    <img src="icon.svg" alt="" class="logo-icon" style="width:32px;height:32px;vertical-align:middle;margin-right:8px;border-radius:50%;">
    Хераборина
  </div>
  <div class="topbar-actions">
    <button id="btn-heart" class="btn-icon" title="Пасхалка">❤️</button>
    <button id="btn-lock" class="btn-icon" title="Заблокировать">🔒</button>
  </div>
</header>

<main id="content"></main>
<main id="content-diary" class="hidden"></main>
<main id="content-projects" class="hidden"></main>
<main id="content-activity" class="hidden"></main>
</div>

<div id="loading" class="screen hidden">
<div class="spinner"></div>
<p>Расшифровка…</p>
</div>

<nav class="tabs" style="display: none;">
  <button id="tab-dashboard" class="tab tab-active" data-tab="dashboard"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px;"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>Дашборд</button>
  <button id="tab-diary" class="tab" data-tab="diary"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px;"><path d="M4 4h12a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2V4z"/><path d="M4 4v16"/></svg>Дневник</button>
  <button id="tab-projects" class="tab" data-tab="projects"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px;"><path d="M3 7h18v13H3z"/><path d="M3 7l2-4h14l2 4"/><path d="M12 11v6"/></svg>Проекты</button>
  <button id="tab-activity" class="tab"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:4px;"><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>График</button>
</nav>


<div id="joke-modal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.3s;">
    <div style="background: var(--bg2); padding: 30px; border-radius: 16px; text-align: center; max-width: 85%; border: 1px solid var(--accent); transform: scale(0.8); transition: transform 0.3s;">
        <div style="font-size: 36px; font-weight: bold; color: var(--accent); margin-bottom: 20px; letter-spacing: 2px;">Б#@%!</div>
        <h2 style="color: var(--accent); margin-bottom: 15px; font-size: 22px;">Хватит заниматься Херобориной!</h2>
        <div style="font-size: 48px; margin-bottom: 20px; display: inline-block; animation: laughAnim 0.8s infinite;">🤣</div>
        <div style="font-size: 28px; font-weight: bold; margin-bottom: 15px; color: var(--fg);">ИДИ РАБОТАТЬ!</div>
        <div style="font-size: 48px; margin-bottom: 20px; display: inline-block; animation: shakeAnim 0.6s infinite;">😡</div>
        <button onclick="closeJoke()" class="pulse-btn" style="background: var(--accent); color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%;">Хорошо!</button>
    </div>
</div>













<script src="crypto.js?v=204"></script>
<script src="js/ui.js?v=204"></script>
<script src="js/chart.js?v=204"></script>
<script src="js/auth.js?v=204"></script>
<script src="app.js?v=204"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js?v=204', { updateViaCache: 'none' }).catch(function(){});
}
</script>

</body>
</html>
