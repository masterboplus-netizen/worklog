<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Хераборина</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<div id="app"></div>

<div id="pin-screen" class="screen">
<div class="pin-box">
<img src="icon.svg" alt="" class="pin-logo">
<h1>Worklog</h1>
<p class="pin-sub">Введи PIN</p>
<div id="pin-display" class="pin-display"></div>
<div class="pin-pad">
<button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button>
<button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button>
<button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button>
<button data-d="clear" class="pin-fn">C</button><button data-d="0">0</button><button data-d="del" class="pin-fn">⌫</button>
</div>
<div id="pin-error" class="pin-error"></div>
<p class="pin-hint">PIN не хранится на сервере.<br>Данные расшифровываются локально.</p>
</div>
</div>

<div id="dashboard" class="screen hidden">
<header class="topbar">
<div class="logo">⏳ Хераборина</div>
<button id="btn-lock" class="btn-icon" title="Заблокировать">🔒</button>
</header>
<nav class="tabs">
<button id="tab-dashboard" class="tab tab-active" data-tab="dashboard">📊 Дашборд</button>
<button id="tab-diary" class="tab" data-tab="diary">📖 Дневник</button>
</nav>
<main id="content"></main>
<main id="content-diary" class="hidden"></main>
</div>

<div id="loading" class="screen hidden">
<div class="spinner"></div>
<p>Расшифровка…</p>
</div>

<script src="crypto.js?v=8"></script>
<script src="app.js?v=8"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>
